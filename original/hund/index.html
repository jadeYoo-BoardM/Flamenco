<title>훈트 HUND</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24324f">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one-screen card table — designation strip on top, opponents, trick felt, hand docked at bottom. Single dark "game night" look taken from the HUND box. */
:root{
  --navy:#2c3d63; --navy-deep:#1f2c49; --wood:#2a1c17; --wood-2:#3a2a22;
  --cream:#f4ece0; --cream-dim:#c9bca9; --pink:#f04e7b; --gold:#efa92b;
  --line:rgba(244,236,224,.14);
  --f-display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --s-grey:#b2a897; --s-purple:#544b84; --s-pink:#ec6683; --s-teal:#26909a; --s-yellow:#eeae2a;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--navy-deep);color:var(--cream);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-deep)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px 4px;gap:8px;
  background:
   repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.025) 22px 24px),
   repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,255,255,.025) 22px 24px),var(--navy)}
@media (min-width:761px){body{background:var(--navy-deep)}}

/* header */
.top{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.logo{height:19px;width:auto;flex:none}
.start .slogo{width:min(300px,82%);margin:6px auto 2px;display:block}
.copy{font-size:11px;color:var(--cream-dim);margin-top:16px;letter-spacing:.02em}
.lang{display:inline-flex;background:var(--navy-deep);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:500;color:var(--cream-dim)}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--wood)}
.logo small{font-family:var(--f-body);font-size:11px;letter-spacing:.02em;color:var(--cream-dim);margin-left:6px;font-weight:500}
.round{margin-left:auto;font-size:12px;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.round b{color:var(--cream);font-family:var(--f-display);font-size:16px}
.ibtn{background:var(--wood);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}

/* designation strip */
.desig{display:flex;gap:8px;align-items:stretch;background:var(--wood);border-radius:10px;padding:6px;box-shadow:inset 0 0 0 1px var(--line)}
.dcard{width:clamp(64px,17vw,92px);flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center}
.dcard img{width:100%;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dcard span{font-size:10px;color:var(--cream-dim)}
.slots{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;min-width:0}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:7px;padding:3px 2px;position:relative}
.slot.next{background:rgba(239,169,43,.13);box-shadow:inset 0 0 0 1px rgba(239,169,43,.55)}
.slot .ic{width:26px;height:26px;object-fit:contain;border-radius:4px}
.slot .nm{font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.slot .hole{width:34px;height:40px;border:1.5px dashed rgba(244,236,224,.22);border-radius:4px;display:grid;place-items:center;font-size:9px;color:var(--cream-dim)}
.slot .tile{width:34px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.slot .tile.pop{animation:pop 1s ease}
@keyframes pop{0%{transform:scale(2.4) rotate(-14deg);opacity:0}55%{transform:scale(.9) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}

/* opponents */
.opps{display:grid;gap:6px}
.opp{background:rgba(31,44,73,.85);border-radius:9px;padding:6px 6px 5px;box-shadow:inset 0 0 0 1px var(--line);min-width:0;position:relative;transition:box-shadow .2s}
.opp.turn{box-shadow:inset 0 0 0 2px var(--gold)}
.oh{display:flex;align-items:center;gap:5px;min-width:0}
.disc{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1.5px rgba(0,0,0,.35)}
.oname{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocnt{margin-left:auto;font-size:11px;color:var(--cream-dim);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.ocnt i{width:8px;height:12px;border-radius:2px;background:var(--wood-2);box-shadow:inset 0 0 0 1px var(--cream-dim);display:inline-block}
.fm{width:16px;height:16px;flex:none}
.chips{display:flex;gap:3px;margin-top:5px}
.chip{flex:1;min-width:0;height:17px;border-radius:3px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;opacity:.35}
.chip.has{opacity:1}
.chip.c-grey{background:var(--s-grey)}.chip.c-purple{background:var(--s-purple)}.chip.c-pink{background:var(--s-pink)}.chip.c-teal{background:var(--s-teal)}.chip.c-yellow{background:var(--s-yellow)}

/* table */
.table{flex:1;min-height:0;position:relative;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#3a2b23 0%,var(--wood) 70%);box-shadow:inset 0 0 0 1px var(--line),inset 0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.trick{display:flex;gap:6px;justify-content:center;align-items:flex-end;flex-wrap:nowrap}
.tc{display:flex;flex-direction:column;align-items:center;gap:4px}
.tc.ghost img{visibility:hidden}
.fly{position:fixed;z-index:15;pointer-events:none;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.55);transform-origin:0 0;will-change:transform,opacity;margin:0}
.tc img{width:clamp(52px,15vw,86px);border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.55);transition:transform .45s ease,box-shadow .45s}
.tc.win img{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.6)}
.tc .who{font-size:10.5px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.tc .who .disc{width:9px;height:9px}
@keyframes deal{from{transform:translateY(16px) scale(.9);opacity:0}}
.msg{font-size:13px;color:var(--cream-dim);text-align:center;margin-top:10px;min-height:1.4em;padding:0 8px}
.msg b{color:var(--cream)}
.lead-hint{position:absolute;top:8px;left:10px;font-size:11px;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,14,11,.92);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.6);animation:toast 2.8s ease forwards;pointer-events:none;z-index:5}
.toast img{width:44px}
.toast .t1{font-family:var(--f-display);font-size:19px;font-weight:700}
.toast .t2{font-size:12px;color:var(--cream-dim)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}82%{opacity:1}100%{opacity:0}}

/* me */
.me{display:flex;flex-direction:column;gap:5px}
.mebar{display:flex;align-items:center;gap:6px;min-width:0}
.mebar .oname{font-size:13px}
.mebar .chips{margin:0;flex:1;max-width:220px;margin-left:auto}
.me.turn .mebar .oname{color:var(--gold)}
.hand{display:flex;justify-content:center;padding:14px 0 4px;min-height:calc(clamp(56px,16.5vw,96px)*1.53 + 18px)}
.hc{width:clamp(56px,16.5vw,96px);flex:none;border:0;background:none;padding:0;position:relative;transition:transform .15s,filter .15s}
.hc img{width:100%;display:block;border-radius:6px;box-shadow:-2px 3px 8px rgba(0,0,0,.5)}
.hc.off{filter:brightness(.45) saturate(.6)}
.hc.sel{transform:translateY(-14px)}
.hc.sel img{box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.6)}
.hand.myturn .hc:not(.off):hover{transform:translateY(-8px)}
.hand.myturn .hc.sel:hover{transform:translateY(-14px)}
.hc .dv{position:absolute;inset:auto 0 -3px auto;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#2a1c17;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.playbar{display:flex;justify-content:center;min-height:34px}
.pbtn{background:var(--pink);border:0;border-radius:999px;padding:8px 22px;font-weight:700;font-size:14px;box-shadow:0 3px 0 #a52c50}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a52c50}
.pbtn.ghost{background:var(--wood);box-shadow:0 0 0 1px var(--line)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,12,22,.72);display:grid;place-items:center;z-index:20;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{background:var(--wood);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.6);width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 16px}
.panel h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.panel h3{font-family:var(--f-display);font-size:16px;margin:16px 0 6px}
.panel p{margin:6px 0;line-height:1.6;color:var(--cream-dim)}
.panel .sub{font-size:12.5px;color:var(--cream-dim);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--cream-dim);font-weight:500}
td:first-child,th:first-child{text-align:left}
td.tot{font-family:var(--f-display);font-weight:700;font-size:16px}
.pos{color:#8fd6a0}.neg{color:#ff8fa8}
.thead-ic{width:18px;height:18px;vertical-align:-4px;border-radius:3px}

/* start */
.start{text-align:center}
.start .hero{display:flex;justify-content:center;gap:4px;margin:6px 0 10px}
.start .hero img{width:52px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.start .hero img:nth-child(even){transform:translateY(8px)}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:.16em;margin:2px 0 0}
.pc{display:flex;gap:8px;justify-content:center;margin:14px 0 6px}
.pc button{min-width:64px;padding:10px 12px;white-space:nowrap;border-radius:10px;background:var(--navy-deep);border:1px solid var(--line);font-weight:700;font-size:15px}
.pc button[aria-pressed="true"]{background:var(--cream);color:var(--wood);border-color:var(--cream)}
.pc button small{display:block;font-size:10px;font-weight:500;opacity:.75}

/* board */
.board{position:relative;width:100%;max-width:440px;margin:6px auto 0;aspect-ratio:1/1}
.board img{width:100%;height:100%;border-radius:8px;display:block}
.bd{position:absolute;width:6.2%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.6),0 0 0 2px rgba(20,14,11,.7)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.legend span{display:flex;align-items:center;gap:5px}
.chooser{display:grid;gap:8px;margin-top:10px}
.chooser button{display:flex;align-items:center;gap:8px;background:var(--navy-deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-weight:500}
.rules li{margin:5px 0;line-height:1.55;color:var(--cream-dim)}
.rules b{color:var(--cream)}
.rules ul{padding-left:18px;margin:4px 0}
.mycards{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mycards img{width:38px;border-radius:3px}
@media (max-height:640px){.desig .dcard span{display:none}.slot .hole,.slot .tile{height:32px;width:28px}.slot .ic{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <div class="top">
    <img class="logo" id="logo" alt="HUND">
    <div class="round" id="round"></div>
    <button class="ibtn" id="bScore"></button>
    <button class="ibtn" id="bRules"></button>
    <button class="ibtn" id="bMenu"></button>
  </div>
  <div class="desig">
    <div class="dcard"><img id="dimg" alt=""><span id="dlabel"></span></div>
    <div class="slots" id="slots"></div>
  </div>
  <div class="opps" id="opps"></div>
  <div class="table" id="table">
    <div class="lead-hint" id="trickNo"></div>
    <div class="trick" id="trick"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="me" id="me">
    <div class="mebar"><span class="disc" id="myDisc"></span><span class="oname" id="myName"></span><img class="fm" id="myFm" src="" alt="" hidden><span class="ocnt" id="myScore"></span><div class="chips" id="myChips"></div></div>
    <div class="hand" id="hand"></div>
    <div class="playbar" id="playbar"></div>
  </div>
</div>
<div id="overlay"></div>

const MAXV={3:6,4:8,5:10};
const ROUNDS=5;
// score track centres on the 984px board art
const TRACK={19:[225,110],18:[350,110],17:[475,110],16:[600,110],15:[718,135],14:[718,240],13:[600,258],12:[475,258],11:[350,258],10:[225,258],9:[105,275],8:[110,385],7:[225,405],6:[348,405],5:[475,405],4:[600,405],3:[718,425],2:[718,540],1:[600,555],0:[475,555],'-1':[345,555],'-2':[220,555],'-3':[105,575],'-4':[105,682],'-5':[220,705],'-6':[345,705],'-7':[470,705],'-8':[600,705],'-9':[718,718],'-10':[718,835],'-11':[598,850],'-12':[470,850],'-13':[345,850],'-14':[220,850]};
const STAR=[78,108], CROSS=[78,852];

const $=s=>document.getElementById(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms*G.speed));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cimg=c=>IMG[SUITS[c.s]+c.v];
const key=c=>c.s*100+c.v;

let G={speed:1,token:0};

/* ---------- game state ---------- */
function newGame(n){
  G={speed:1,token:G.token+1,n,round:0,players:[],design:shuffle([1,2,3,4,5]),first:Math.random()*n|0,decider:null,history:[]};
  for(let i=0;i<n;i++)G.players.push({name:L.pn[i],color:PCOL[i],human:i===0,hand:[],won:[],score:0});
  run(G.token);
}
const abort=t=>{if(t!==G.token)throw 'abort'};

function deal(){
  const deck=[];const mv=MAXV[G.n];
  for(let s=0;s<5;s++)for(let v=1;v<=mv;v++)deck.push({s,v});
  shuffle(deck);
  const per=deck.length/G.n;
  G.players.forEach((p,i)=>{p.hand=deck.slice(i*per,(i+1)*per).sort((a,b)=>a.s-b.s||a.v-b.v);p.won=[]});
  G.roles={}; G.suitRole={}; G.nextRole=0; G.played=[]; G.trick=[]; G.voids=G.players.map(()=>[0,0,0,0,0]); G.trickNo=0;
  G.D=G.design[G.round];
}

function legal(p){
  const h=G.players[p].hand;
  if(!G.trick.length)return h.slice();
  const L=G.trick[0].c.s; const f=h.filter(c=>c.s===L);
  return f.length?f:h.slice();
}
function winnerOf(trick,trumpSuit){
  const L=trick[0].c.s;
  let best=null;
  for(const t of trick){
    const tr=t.c.s===trumpSuit, bt=best&&best.c.s===trumpSuit;
    if(!best){best=t;continue}
    if(tr&&!bt){best=t;continue}
    if(tr===bt&&t.c.s===best.c.s&&t.c.v>best.c.v)best=t;
    if(!tr&&!bt&&t.c.s===L&&best.c.s!==L)best=t;
  }
  return best;
}
// apply designation for a played card on a roles object; returns list of new [role,suit]
function designate(st,c){
  const out=[];
  if(c.v!==G.D||st.nextRole>3||st.suitRole[c.s])return out;
  const r=ROLES[st.nextRole]; st.roles[r]=c.s; st.suitRole[c.s]=r; st.nextRole++; out.push([r,c.s]);
  if(st.nextRole===4){const s=[0,1,2,3,4].find(x=>!st.suitRole[x]); st.roles.lead=s; st.suitRole[s]='lead'; st.nextRole=5; out.push(['lead',s])}
  return out;
}
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function seatRect(p){
  const el=p===0?document.querySelector('#me .mebar'):document.querySelector(`.opp[data-p="${p}"]`);
  return el?el.getBoundingClientRect():null;
}
function miniAt(r,w){const h=w*1.53;return {left:r.left+r.width/2-w/2,top:r.top+r.height/2-h/2,width:w}}
// moves an image from rect a to rect b (left/top/width), placed at `place`
function animImg(src,place,a,b,o0,o1,dur,rot=0){
  if(reduced()||!place||!a||!b)return Promise.resolve();
  const im=document.createElement('img'); im.src=src; im.className='fly';
  Object.assign(im.style,{left:place.left+'px',top:place.top+'px',width:place.width+'px'});
  document.body.appendChild(im);
  const T=(r,deg)=>`translate(${r.left-place.left}px,${r.top-place.top}px) scale(${r.width/place.width}) rotate(${deg}deg)`;
  const an=im.animate([{transform:T(a,rot),opacity:o0},{transform:T(b,0),opacity:o1}],{duration:dur*G.speed,easing:'cubic-bezier(.25,.75,.3,1)',fill:'forwards'});
  return an.finished.catch(()=>{}).then(()=>im.remove());
}
async function playCard(p,c,t){
  const P=G.players[p];
  // where the card comes from
  let from=null;
  if(p===0){const b=document.querySelector(`.hc[data-k="${key(c)}"] img`);if(b){const r=b.getBoundingClientRect();from={left:r.left,top:r.top-10,width:r.width}}}
  else{const r=seatRect(p);if(r)from=miniAt(r,26)}
  P.hand=P.hand.filter(x=>key(x)!==key(c));
  if(G.trick.length&&c.s!==G.trick[0].c.s)G.voids[p][G.trick[0].c.s]=1;
  G.trick.push({p,c}); G.played.push(c);
  const news=designate(G,c);
  G.flyKey=key(c); render();
  const tgt=document.querySelector(`.tc[data-k="${key(c)}"] img`);
  if(tgt&&from){const r=tgt.getBoundingClientRect();const to={left:r.left,top:r.top,width:r.width};
    await animImg(cimg(c),to,from,to,p===0?1:0.3,1,p===0?650:800,p===0?0:(p%2?-14:14));}
  G.flyKey=null; render(); abort(t);
  for(const [r,s] of news){await sleep(350); abort(t); toast(r,s,p); render(r); await sleep(2800); abort(t)}
}
async function collectTrick(w){
  const imgs=[...document.querySelectorAll('#trick .tc img')];
  const sr=seatRect(w); if(!sr||reduced())return;
  const to=miniAt(sr,22);
  $('trick').style.visibility='hidden';
  await Promise.all(imgs.map((im,i)=>{const r=im.getBoundingClientRect();const a={left:r.left,top:r.top,width:r.width};
    return new Promise(res=>setTimeout(res,i*90*G.speed)).then(()=>animImg(im.src,a,a,to,1,0.15,700,0))}));
}

/* ---------- scoring ---------- */
function scoreRound(){
  const cnt=(p,s)=>p.won.filter(c=>c.s===s).length;
  const R=G.roles; const hc=G.players.map(p=>cnt(p,R.hund));
  const mn=Math.min(...hc), mx=Math.max(...hc);
  const rows=G.players.map((p,i)=>{
    const plus=cnt(p,R.plus), minus=cnt(p,R.minus), hund=(hc[i]===mn||hc[i]===mx)?0:3;
    const lead=cnt(p,R.lead), trump=cnt(p,R.trump);
    return {i,plus,minus,hund,hcount:hc[i],lead,trump,total:plus+hund-minus};
  });
  const ml=Math.max(...rows.map(r=>r.lead));
  let cands=rows.filter(r=>r.lead===ml).map(r=>r.i);
  if(cands.length>1){
    const top=i=>Math.max(...G.players[i].won.filter(c=>c.s===R.lead).map(c=>c.v));
    cands.sort((a,b)=>top(b)-top(a));
  }
  const decider=cands[0];
  rows.forEach(r=>{G.players[r.i].score+=r.total});
  return {rows,decider};
}

/* ---------- AI ---------- */
function unseenFor(p){
  const seen=new Set(G.played.map(key)); G.players[p].hand.forEach(c=>seen.add(key(c)));
  const out=[];const mv=MAXV[G.n];
  for(let s=0;s<5;s++)for(let v=1;v<=mv;v++)if(!seen.has(s*100+v))out.push({s,v});
  return out;
}
function hundGain(p,s){
  const hc=G.players.map(P=>P.won.filter(c=>c.s===s).length);
  const me=hc[p]; const ot=hc.filter((_,i)=>i!==p);
  const f=x=>(x>Math.min(...ot)&&x<Math.max(...ot))?3:0;
  const prog=G.trickNo/10; // later in round, counts are more final
  const g=f(me+1)-f(me);
  return prog*g*0.5 + (1-prog)*0.25 + (me>=Math.max(...ot)&&me>0?-0.6:0);
}
function roleVal(p,r,s){
  switch(r){case 'plus':return 1;case 'minus':return -1;case 'trump':return 0;case 'lead':return 0.15;case 'hund':return hundGain(p,s)}
}
function suitVal(p,s,st){
  const r=st.suitRole[s]; if(r)return roleVal(p,r,s);
  const rem=ROLES.filter(x=>st.roles[x]===undefined);
  return rem.reduce((a,x)=>a+roleVal(p,x,s),0)/rem.length;
}
function pWin(p,c,st){
  const all=G.trick.concat([{p,c}]);
  const T=st.roles.trump; const w=winnerOf(all,T);
  if(w.p!==p)return 0;
  const later=G.n-all.length; if(!later)return 1;
  const L=all[0].c.s; const un=unseenFor(p).filter(x=>key(x)!==key(c)); const U=Math.max(1,un.length);
  let prob=1;
  for(let k=1;k<=later;k++){
    const j=(p+k)%G.n; const hj=G.players[j].hand.length;
    const voidL=G.voids[j][L]?1:Math.pow(1-un.filter(x=>x.s===L).length/U,hj);
    let beat;
    if(c.s===L){
      const hi=un.filter(x=>x.s===L&&x.v>c.v).length;
      const pHi=G.voids[j][L]?0:1-Math.pow(1-hi/U,hj);
      const pT=(T!==undefined&&T!==L)?1-Math.pow(1-un.filter(x=>x.s===T).length/U,hj):0;
      beat=pHi+(1-pHi)*voidL*pT*0.6;
    }else{ // I trumped
      const hi=un.filter(x=>x.s===T&&x.v>c.v).length;
      beat=voidL*(1-Math.pow(1-hi/U,hj))*0.8;
    }
    prob*=1-Math.min(1,beat);
  }
  return prob;
}
function aiPick(p){
  const P=G.players[p]; const opts=legal(p);
  const un=unseenFor(p);
  let best=null,bs=-1e9;
  for(const c of opts){
    const st={roles:{...G.roles},suitRole:{...G.suitRole},nextRole:G.nextRole};
    const news=designate(st,c);
    // designation effect
    let eff=0;
    for(const [r,s] of news){
      const before=suitVal(p,s,{roles:G.roles,suitRole:G.suitRole});
      const after=roleVal(p,r,s);
      const mine=P.won.filter(x=>x.s===s).length;
      const opp=G.players.reduce((a,Q,i)=>i===p?a:a+Q.won.filter(x=>x.s===s).length,0)/(G.n-1);
      const handS=P.hand.filter(x=>x.s===s&&key(x)!==key(c));
      const strong=handS.reduce((a,x)=>a+(x.v>MAXV[G.n]/2?1:0.35),0);
      eff+=(after-before)*(mine-opp)+(r==='trump'?0.3*handS.length:(after-before)*strong*0.45);
    }
    const pw=pWin(p,c,st);
    const later=G.n-G.trick.length-1;
    const avgUn=un.length?un.reduce((a,x)=>a+suitVal(p,x.s,st),0)/un.length:0;
    const T=G.trick.reduce((a,t)=>a+suitVal(p,t.c.s,st),0)+suitVal(p,c.s,st)+later*avgUn;
    let sc=pw*T-(1-pw)*T*0.35+eff;
    if(T>=0&&pw>0.85)sc-=0.012*c.v; // win cheaply
    if(T<0)sc+=0.012*c.v*(1-pw); // dump high cards when losing
    if(st.roles.trump===c.s&&pw<0.5)sc-=0.12; // save trumps
    if(!G.trick.length&&st.roles.trump===c.s&&T<0.3)sc-=0.15;
    sc+=Math.random()*0.04;
    if(sc>bs){bs=sc;best=c}
  }
  return best;
}
function aiChooseFirst(p){
  const h=G.players[p].hand; const mv=MAXV[G.n];
  const strong=h.filter(c=>c.v>=mv-1).length+h.filter(c=>c.v===G.D).length*0.5;
  return strong>=3?p:(p+1)%G.n;
}

/* ---------- flow ---------- */
let humanResolve=null, selected=null;
function humanPick(){return new Promise(r=>{humanResolve=r;selected=null;render()})}

async function run(t){
  try{
    closeOv(); $('trick').style.visibility='';
    for(G.round=0;G.round<ROUNDS;G.round++){
      deal(); G.phase='deal'; render(); abort(t);
      setMsg(L.rstart(G.round+1,G.D));
      await sleep(900); abort(t);
      if(G.round>0){
        const d=G.decider;
        if(d===0){G.first=await chooseFirstHuman()}
        else{setMsg(L.deciding(G.players[d].name));await sleep(1100);abort(t);G.first=aiChooseFirst(d);
          setMsg(L.decided(G.players[d].name,G.players[G.first].name));await sleep(1300)}
        abort(t);
      }
      let leader=G.first;
      for(G.trickNo=0;G.trickNo<10;G.trickNo++){
        G.trick=[]; G.leader=leader; render();
        for(let k=0;k<G.n;k++){
          const p=(leader+k)%G.n; G.turn=p; render();
          let c;
          if(p===0){setMsg(k===0?L.leadFirst:L.follow(SUITKO[G.trick[0].c.s]));c=await humanPick();abort(t);humanResolve=null}
          else{setMsg(L.turnOf(G.players[p].name));await sleep(950);abort(t);c=aiPick(p)}
          await playCard(p,c,t); abort(t);
          await sleep(p===0?350:550); abort(t);
        }
        G.turn=null;
        const w=winnerOf(G.trick,G.roles.trump); G.win=w; render();
        setMsg(L.takes(G.players[w.p].name));
        await sleep(1700); abort(t);
        await collectTrick(w.p); abort(t);
        G.players[w.p].won.push(...G.trick.map(x=>x.c)); G.win=null; G.trick=[]; leader=w.p;
        render(); $('trick').style.visibility=''; await sleep(400); abort(t);
      }
      G.phase='score'; render();
      const prev=G.players.map(p=>p.score);
      const res=scoreRound(); G.decider=res.decider; G.history.push(res);
      await showRoundResult(res,prev); abort(t);
    }
    showEnd();
  }catch(e){if(e!=='abort')throw e}
}

/* ---------- rendering ---------- */
function setMsg(h){$('msg').innerHTML=h}
function chipsHTML(p){
  return SUITS.map((s,i)=>{const n=p.won.filter(c=>c.s===i).length;return `<span class="chip c-${s} ${n?'has':''}" title="${SUITKO[i]} ${L.cards(n)}">${n}</span>`}).join('');
}
function render(pop){
  if(!G.players||!G.roles)return;
  $('round').innerHTML=L.roundHd(Math.min(G.round+1,ROUNDS),ROUNDS);
  $('dimg').src=G.D?IMG['d'+G.D]:IMG.dback;
  $('slots').innerHTML=ROLES.map((r,i)=>{
    const s=G.roles?G.roles[r]:undefined;
    const nx=G.roles&&i===G.nextRole&&i<4;
    return `<div class="slot ${nx?'next':''}" title="${ROLEKO[r]}: ${ROLEDESC[r]}"><img class="ic" src="${IMG['ic_'+r]}" alt=""><span class="nm">${ROLEKO[r]}</span>${s!==undefined?`<img class="tile ${pop===r?'pop':''}" src="${IMG['tile_'+SUITS[s]]}" alt="${SUITKO[s]}">`:`<span class="hole">${nx?L.next:''}</span>`}</div>`;
  }).join('');

  $('opps').innerHTML=op.map((p,k)=>{const i=k+1;return `<div class="opp ${G.turn===i?'turn':''}" data-p="${i}"><div class="oh"><span class="disc" style="background:${p.color}"></span><span class="oname">${p.name}</span>${(G.round>0?G.decider:G.first)===i?`<img class="fm" src="${IMG.first}" alt="">`:''}<span class="ocnt"><i></i>${p.hand.length}</span></div><div class="chips">${chipsHTML(p)}</div></div>`}).join('');
  $('trickNo').textContent=G.phase==='score'||G.phase==='end'?'':L.trick(Math.min(G.trickNo+1,10));
  $('trick').innerHTML=(G.trick||[]).map(t=>`<div class="tc ${G.win&&G.win.p===t.p?'win':''} ${G.flyKey===key(t.c)?'ghost':''}" data-k="${key(t.c)}"><img src="${cimg(t.c)}" alt="${SUITKO[t.c.s]} ${t.c.v}"><span class="who"><span class="disc" style="background:${G.players[t.p].color}"></span>${G.players[t.p].name}</span></div>`).join('');
  const me=G.players[0];
  $('myDisc').style.background=me.color;
  $('myFm').src=IMG.first; $('myFm').hidden=(G.round>0?G.decider:G.first)!==0;
  $('myScore').textContent=L.pts(me.score); $('myName').textContent=me.name;
  $('myChips').innerHTML=chipsHTML(me);
  $('me').classList.toggle('turn',G.turn===0);
  // hand
  const H=$('hand'); const my=!!humanResolve; H.classList.toggle('myturn',my);
  const ok=my?new Set(legal(0).map(key)):null;
  H.innerHTML=me.hand.map(c=>`<button class="hc ${my&&!ok.has(key(c))?'off':''} ${selected&&key(selected)===key(c)?'sel':''}" data-k="${key(c)}" aria-label="${SUITKO[c.s]} ${c.v}"><img src="${cimg(c)}" alt="">${c.v===G.D&&G.nextRole<4?'<span class="dv">!</span>':''}</button>`).join('');
  fitHand();
  $('playbar').innerHTML=my&&selected?`<button class="pbtn" id="bPlay">${L.play(SUITKO[selected.s],selected.v)}</button>`:(my?`<span class="msg" style="margin:6px 0 0">${L.tapHint}</span>`:'');
  if($('bPlay'))$('bPlay').onclick=()=>commit(selected);
}
function fitHand(){
  const H=$('hand'); const cards=[...H.children]; if(!cards.length)return;
  const w=cards[0].getBoundingClientRect().width; const avail=H.clientWidth;
  const n=cards.length; const need=n*w+(n-1)*4;
  const ov=need>avail?(need-avail)/(n-1)+4:-4;
  cards.forEach((c,i)=>c.style.marginLeft=i?`${-ov}px`:'0');
}
window.addEventListener('resize',fitHand);
$('hand').addEventListener('click',e=>{
  const b=e.target.closest('.hc'); if(!b||!humanResolve)return;
  const k=+b.dataset.k; const c=G.players[0].hand.find(x=>key(x)===k);
  if(!legal(0).some(x=>key(x)===k)){setMsg(L.mustFollow(SUITKO[G.trick[0].c.s]));return}
  if(selected&&key(selected)===k){commit(c);return}
  selected=c; render();
});
function commit(c){if(!humanResolve||!c)return;const r=humanResolve;humanResolve=null;selected=null;r(c)}

function toast(r,s,p){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const d=document.createElement('div'); d.className='toast';
  d.innerHTML=`<img src="${IMG['tile_'+SUITS[s]]}" alt=""><div><div class="t1">${SUITKO[s]} = ${ROLEKO[r]}</div><div class="t2">${r==='lead'?L.autoLead:L.whose(G.players[p].name,SUITKO[s],G.D)} · ${ROLEDESC[r]}</div></div>`;
  $('table').appendChild(d); setTimeout(()=>d.remove(),2800);
}

/* ---------- overlays ---------- */
function ov(html){$('overlay').innerHTML=`<div class="ov"><div class="panel">${html}</div></div>`;return $('overlay').firstChild}
function closeOv(){$('overlay').innerHTML=''}
function boardHTML(scores){
  const n=G.players.length; const groups={};
  G.players.forEach((p,i)=>{const s=scores?scores[i]:p.score;const k=s>19?'star':s<-14?'cross':String(s);(groups[k]=groups[k]||[]).push(i)});
  let discs='';
  G.players.forEach((p,i)=>{
    const s=scores?scores[i]:p.score; const k=s>19?'star':s<-14?'cross':String(s);
    const [x,y]=k==='star'?STAR:k==='cross'?CROSS:TRACK[k];
    const g=groups[k]; const idx=g.indexOf(i); const off=(idx-(g.length-1)/2)*18;
    discs+=`<span class="bd" data-i="${i}" style="background:${p.color};left:${(x+off)/984*100}%;top:${(y-off*0.35)/984*100}%"></span>`;
  });
  return `<div class="board"><img src="${IMG.board}" alt="">${discs}</div>
  <div class="legend">${G.players.map(p=>`<span><span class="disc" style="background:${p.color}"></span>${p.name} <b>${p.score}</b></span>`).join('')}</div>`;
}
function showBoard(){
  if(!G.players)return;
  const o=ov(`<h2>${L.score}</h2><div class="sub">${L.boardSub(Math.min(G.round+1,ROUNDS),ROUNDS)}</div>${boardHTML()}<div class="row"><button class="pbtn ghost" id="bx">${L.close}</button></div>`);
  $('bx').onclick=closeOv;
}
function sgn(n){return n>0?`<span class="pos">+${n}</span>`:n<0?`<span class="neg">${n}</span>`:'0'}
function showRoundResult(res,prev){
  return new Promise(resolve=>{
    const R=G.roles; const ic=r=>`<img class="thead-ic" src="${IMG['tile_'+SUITS[R[r]]]}" alt="">`;
    const last=G.round===ROUNDS-1;
    const d=res.decider;
    const o=ov(`<h2>${L.result(G.round+1)}</h2>
      <div class="sub">${ROLES.map(r=>`${L.role[r]} ${SUITKO[R[r]]}`).join(' · ')}</div>
      <div class="tbl"><table><thead><tr><th></th><th>${ic('plus')}<br>${L.role.plus}</th><th>${ic('hund')}<br>${L.role.hund}</th><th>${ic('minus')}<br>${L.role.minus}</th><th>${ic('lead')}<br>${L.role.lead}</th><th>${L.thisR}</th><th>${L.total}</th></tr></thead><tbody>
      ${res.rows.map(r=>{const p=G.players[r.i];return `<tr><td><span style="display:inline-flex;gap:5px;align-items:center"><span class="disc" style="background:${p.color}"></span>${p.name}</span></td><td>${sgn(r.plus)}</td><td>${sgn(r.hund)} <small style="color:var(--cream-dim)">(${L.cards(r.hcount)})</small></td><td>${sgn(-r.minus)}</td><td>${L.cards(r.lead)}</td><td class="tot">${sgn(r.total)}</td><td class="tot">${p.score}</td></tr>`}).join('')}
      </tbody></table></div>
      ${last?'':`<p>${L.nextDecider(G.players[d].name)}</p>`}
      <div id="bwrap">${boardHTML(prev)}</div>
      <div class="row"><button class="pbtn" id="bn">${last?L.finalBtn:L.nextBtn}</button></div>`);
    setTimeout(()=>{G.players.forEach((p,i)=>{
      const s=p.score; const k=s>19?'star':s<-14?'cross':String(s);
      const [x,y]=k==='star'?STAR:k==='cross'?CROSS:TRACK[k];
      const g=G.players.map((q,j)=>j).filter(j=>{const t=G.players[j].score;return (t>19?'star':t<-14?'cross':String(t))===k});
      const idx=g.indexOf(i); const off=(idx-(g.length-1)/2)*18;
      const el=o.querySelector(`.bd[data-i="${i}"]`); if(el){el.style.left=(x+off)/984*100+'%';el.style.top=(y-off*0.35)/984*100+'%'}
    });},500);
    $('bn').onclick=()=>{closeOv();resolve()};
  });
}
function chooseFirstHuman(){
  return new Promise(resolve=>{
    render();
    const o=ov(`<h2>${L.chooseT}</h2><div class="sub">${L.chooseSub(G.D)}</div>
      <div class="mycards">${G.players[0].hand.map(c=>`<img src="${cimg(c)}" alt="">`).join('')}</div>
      <div class="chooser">${G.players.map((p,i)=>`<button data-i="${i}"><span class="disc" style="background:${p.color}"></span>${p.name}${i===0?L.meFirst:''}<span style="margin-left:auto;color:var(--cream-dim);font-size:12px">${L.pts(p.score)}</span></button>`).join('')}</div>`);
    o.querySelectorAll('.chooser button').forEach(b=>b.onclick=()=>{closeOv();resolve(+b.dataset.i)});
  });
}
function showEnd(){
  G.phase='end'; render();
  const best=Math.max(...G.players.map(p=>p.score));
  const order=G.players.map((p,i)=>i).sort((a,b)=>G.players[b].score-G.players[a].score);
  const winners=order.filter(i=>G.players[i].score===best).map(i=>G.players[i].name);
  const iWon=G.players[0].score===best;
  ov(`<h2>${iWon?(winners.length>1?L.tieWin:L.iWin):L.theyWin(winners.join(', '))}</h2>
    <div class="sub">${L.endSub}</div>
    ${boardHTML()}
    <div class="tbl"><table><thead><tr><th>${L.rank}</th>${[1,2,3,4,5].map(r=>`<th>R${r}</th>`).join('')}<th>${L.sum}</th></tr></thead><tbody>
    ${order.map(i=>{const p=G.players[i];return `<tr><td><span style="display:inline-flex;gap:5px;align-items:center"><span class="disc" style="background:${p.color}"></span>${p.name}</span></td>${G.history.map(h=>`<td>${sgn(h.rows[i].total)}</td>`).join('')}<td class="tot">${p.score}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="row"><button class="pbtn ghost" id="bs">${L.changeN}</button><button class="pbtn" id="ba">${L.again}</button></div>`);
  $('ba').onclick=()=>newGame(G.n); $('bs').onclick=showStart;
}
function showStart(){
  const o=ov(`<div class="start">
    <div class="hero">${SUITS.map(s=>`<img src="${IMG['tile_'+s]}" alt="">`).join('')}</div>
    <img class="slogo" src="${IMG.logo}" alt="HUND">
    <div class="sub">${L.tagline}</div>
    <div class="lang" id="lang"><button data-l="ko" aria-pressed="${pref.lang==='ko'}">한국어</button><button data-l="en" aria-pressed="${pref.lang==='en'}">English</button></div>
    <div class="pc" id="pc">${[3,4,5].map(n=>`<button aria-pressed="${pref.n===n}" data-n="${n}">${L.np(n)}<small>${L.ai(n-1)}</small></button>`).join('')}</div>
    <div class="sub">${L.deckInfo(pref.n,MAXV[pref.n])}</div>
    <div class="row" style="justify-content:center"><button class="pbtn ghost" id="br2">${L.quick}</button><button class="pbtn" id="bgo">${L.start}</button></div>
    <div class="copy">Copyright BoardM for Demo purpose only</div>
  </div>`);
  o.querySelectorAll('#pc button').forEach(b=>b.onclick=()=>{pref.n=+b.dataset.n;savePref();showStart()});
  o.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{pref.lang=b.dataset.l;L=TX[pref.lang];savePref();applyLang();
    if(G.players)G.players.forEach((p,i)=>p.name=L.pn[i]);render();showStart()});
  $('bgo').onclick=()=>newGame(pref.n); $('br2').onclick=()=>showRules(true);
}
function showRules(fromStart){
  ov(`<h2>${L.quick}</h2><div class="rules"><ul>${L.rulesHtml}</ul></div><div class="row"><button class="pbtn" id="bx">${fromStart?L.back:L.close}</button></div>`);
  $('bx').onclick=fromStart?showStart:closeOv;
}
function showMenu(){
  ov(`<h2>${L.newT}</h2><div class="sub">${L.newSub}</div><div class="row"><button class="pbtn ghost" id="bc">${L.cont}</button><button class="pbtn" id="bn2">${L.newGo}</button></div>`);
  $('bc').onclick=closeOv; $('bn2').onclick=()=>{G.token++;humanResolve=null;showStart()};
}
$('bScore').onclick=showBoard; $('bRules').onclick=()=>showRules(false); $('bMenu').onclick=showMenu;

// opening view: dealt sample table behind the start panel
G.n=pref.n; G.players=[]; for(let i=0;i<G.n;i++)G.players.push({name:L.pn[i],color:PCOL[i],hand:[],won:[],score:0});
G.round=0; G.design=[1,2,3,4,5]; deal(); G.first=0; $('logo').src=IMG.logo; applyLang(); render(); showStart();
</script>
