<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하티">
<meta name="theme-color" content="#5c1238">
<title>하티 — AI 대전</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --paper:#f5eddb; --paper2:#ece0c4; --ink:#2a211b; --mute:#7a6b5c; --line:#d8c8a6;
  --maroon:#6d1745; --maroon2:#8f2a5c; --gold:#c9a24a;
  --el:#2a4fa6; --ti:#a2441f; --mo:#17724f;
  --you:#1d5fa8; --ai:#a3243c;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#3b0d25}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--ink);font-size:14px;line-height:1.45;-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 80% at 50% 0%,#6d1745 0%,#3b0d25 70%) fixed}
.serif{font-family:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif}
b.el,.el{color:var(--el)} b.ti,.ti{color:var(--ti)} b.mo,.mo{color:var(--mo)}
b.you{color:var(--you)} b.ai{color:var(--ai)} b.chn{color:var(--maroon)}
button{font:inherit;cursor:pointer;white-space:nowrap;border:0;border-radius:999px;padding:9px 16px;min-height:40px;
  background:var(--maroon);color:#fff;font-weight:700;letter-spacing:-.2px;box-shadow:0 2px 0 #3b0d25}
button.ghost{background:#fff;color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon) inset}
button.gold{background:linear-gradient(#e2bf62,#b88a2c);color:#3b220b;box-shadow:0 2px 0 #7a5918}
button:disabled{opacity:.4;cursor:default}
#app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px)}
header{display:flex;align-items:center;gap:10px;color:#f8e9cf;padding:4px 4px 8px}
header .logo{font-size:22px;font-weight:900;letter-spacing:1px;white-space:nowrap}
header .meta{font-size:12.5px;opacity:.9;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .sp{flex:1}
header button{white-space:nowrap;padding:6px 12px;min-height:32px;font-size:12.5px;background:rgba(255,255,255,.14);box-shadow:none}
.wins{display:inline-flex;gap:3px;align-items:center}
.wins i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-block}
.wins i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.layout{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 300px}}
.board{background:var(--paper);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.6),transparent 40%),radial-gradient(circle at 90% 90%,rgba(201,162,74,.18),transparent 45%)}
.zone{border-radius:12px;padding:8px;background:rgba(255,255,255,.45);border:1px solid var(--line)}
.zone.aiZ{border-color:#e5c7cf;background:rgba(255,240,243,.55)}
.zone.meZ{border-color:#c9d6ea;background:rgba(240,245,255,.55)}
.zhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.who{font-weight:900;font-size:15px}
.who.ai{color:var(--ai)} .who.you{color:var(--you)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px 2px 3px;background:#fff;border:1px solid var(--line);font-weight:700}
.chip img{height:18px;width:6px;object-fit:cover;border-radius:2px}
.chip.pres{background:var(--maroon);color:#fff;border-color:var(--maroon);padding-left:9px}
.rows{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:6px;min-height:56px;border-radius:9px;padding:3px 6px;background:rgba(255,255,255,.5)}
.row .lab{writing-mode:horizontal-tb;font-size:11.5px;font-weight:800;color:var(--maroon);width:30px;flex:none;text-align:center;line-height:1.1}
.row .lab small{display:block;font-weight:600;color:var(--mute);font-size:10px}
.row .cards{display:flex;flex-wrap:wrap;gap:4px}
.row .seq{margin-left:auto;font-size:10.5px;color:var(--mute);white-space:nowrap}
.card{position:relative;border-radius:7px;overflow:hidden;background:#ddd;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s, box-shadow .15s}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card.mini{width:38px;height:53px;border-radius:5px}
.card.md{width:62px;height:87px}
.card.big{width:78px;height:109px}
.card .badge{position:absolute;left:2px;top:2px;min-width:15px;height:15px;border-radius:8px;font-size:10.5px;font-weight:900;color:#fff;
  line-height:15px;text-align:center;padding:0 3px}
.card .badge.E{background:var(--el)} .card .badge.T{background:var(--ti)} .card .badge.M{background:var(--mo)}
.card .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;text-align:center;font-weight:700;padding:1px 0}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.35)}
.card.pick{cursor:pointer;box-shadow:0 0 0 3px #f2b705,0 0 12px #f2b705;animation:pulse 1.1s infinite}
.card.new{animation:pop .5s}
@keyframes pulse{50%{box-shadow:0 0 0 3px #f2b705,0 0 2px #f2b705}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.hand{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.hand .grp{display:flex;gap:6px;align-items:flex-end}
.hand .card.big{cursor:pointer}
.cwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.cwrap .cl{font-size:10.5px;font-weight:700;color:var(--maroon);text-align:center;line-height:1.15}
.cwrap .cl small{display:block;color:var(--mute);font-weight:600}
.mid{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:8px 0}
.pile{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);font-weight:700}
.pile .stack{position:relative}
.pile .stack::before{content:"";position:absolute;inset:3px -3px -3px 3px;border-radius:7px;background:#cdbb95}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px;justify-content:center}
.duel{display:flex;align-items:center;gap:10px}
.duel .vs{font-weight:900;color:var(--maroon);font-size:18px}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800}
.duel .side .pc{display:flex;gap:3px;align-items:flex-end}
.duel .res{font-size:12.5px;font-weight:800;color:var(--maroon);text-align:center}
.win-mark{color:#b07b00}
.tokens{display:flex;gap:10px;justify-content:center}
.tok{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--mute);position:relative;text-align:center;line-height:1.2}
.tok img{width:46px;height:46px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tok.taken img{filter:grayscale(1) opacity(.45)}
.tok .who{font-size:10.5px}
.bar{margin:8px 0;background:#fffaf0;border:2px solid var(--maroon);
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.bar .msg{flex:1 1 160px;min-width:0;font-weight:700;font-size:14px}
.bar .btns{display:flex;gap:8px;flex-wrap:wrap}
.thinking{display:inline-flex;gap:4px;margin-left:6px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--maroon);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.side-panel{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.panel h3{margin:0 0 6px;font-size:14px;color:var(--maroon)}
.log{max-height:260px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
@media (min-width:960px){.log{max-height:calc(100vh - 330px)}}
.log div{padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.55)}
.log div.r{background:var(--maroon);color:#fff}
.ref{font-size:12px;line-height:1.5}
.ref table{border-collapse:collapse;width:100%}
.ref td{border-top:1px solid var(--line);padding:4px 3px;vertical-align:top}
.ref td:first-child{font-weight:800;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(20,4,12,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal h2{margin:0 0 8px;color:var(--maroon)}
.modal .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.title-art{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.title-art .card{width:70px;height:98px}
.title-art .card:nth-child(1){transform:rotate(-8deg) translateY(6px)} .title-art .card:nth-child(3){transform:rotate(8deg) translateY(6px)}
.big-title{font-size:40px;font-weight:900;color:var(--maroon);text-align:center;letter-spacing:4px;margin:0}
.sub{text-align:center;color:var(--mute);margin:0 0 6px;font-weight:700}
.diff{display:flex;gap:6px;justify-content:center;margin:10px 0}
.diff button{background:#fff;color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon) inset;padding:8px 14px}
.diff button.on{background:var(--maroon);color:#fff}
.score-t{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.score-t th,.score-t td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
.score-t td:first-child,.score-t th:first-child{text-align:left}
.rules h4{margin:12px 0 4px;color:var(--maroon)}
.rules p,.rules li{font-size:13.5px}
.rules ul{padding-left:18px;margin:4px 0}
.hint{font-size:12px;color:var(--mute)}
@media (max-width:420px){
  .card.big{width:68px;height:95px}.card.md{width:54px;height:76px}.card.mini{width:33px;height:46px}
  .row{min-height:50px}.tok img{width:40px;height:40px}
}
.card.glow{box-shadow:0 0 0 3px #ffd34d,0 0 14px 3px rgba(255,200,40,.9);z-index:5}
.card.flipin{animation:flipin .5s ease-out}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.empty-slot{width:62px;height:87px;border:2px dashed var(--line);border-radius:7px}
.empty-slot.sm{opacity:.6}
.duel .side.won .pc{filter:drop-shadow(0 0 6px rgba(255,200,40,.9))}
.duel .side.lost{opacity:.85}
.lose-mark{color:var(--mute);font-size:11px}
.cdeck{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--mute);gap:2px;justify-content:center}
.ghostcard{position:fixed;z-index:60;pointer-events:none}
.floater{position:fixed;z-index:70;pointer-events:none;background:var(--maroon);color:#fff;font-weight:900;font-size:14px;padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.bar{position:relative;overflow:hidden}
.bar.stepbar{border-color:#b88a2c;background:#fff6dc;flex-wrap:nowrap}
.bar.stepbar .msg{flex:1 1 auto}
.bar.stepbar .btns{flex:none}
.bar.stepbar .btns button{padding:7px 12px;min-height:36px}
.stepno{flex:none;width:40px;height:40px;border-radius:50%;background:var(--maroon);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:900;line-height:1}
.stepno small{font-size:9px;opacity:.8;margin-top:1px}
.stepbarfill{position:absolute;left:0;bottom:0;height:3px;background:#b88a2c;width:100%;transform-origin:left;animation:fill linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.speed{display:flex;gap:6px;justify-content:center;margin:6px 0}
.speed button{background:#fff;color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon) inset;padding:8px 14px}
.speed button.on{background:var(--maroon);color:#fff}
@media (max-width:420px){.empty-slot{width:54px;height:76px}}
</style>
</head>

/* ============================================================
   하티(Haati) 규칙 엔진 + AI
   ============================================================ */
const ANIMAL = { E: { name: '코끼리', cls: 'el' }, T: { name: '호랑이', cls: 'ti' }, M: { name: '생쥐', cls: 'mo' } };
const CHARNAME = { merchant: '상인', maharaja: '마하라자', thief: '도둑', hunter: '사냥꾼' };
const TOKENS = {
  palace: { A: { f: 3, h: 0 }, B: { f: 1, h: 1 } },
  jungle: { A: { f: 3, h: 1 }, B: { f: 2, h: 2 } }
};
const LOCNAME = { palace: '궁전', jungle: '정글' };
const ALL_ANIMALS = [];
for (const a of 'ETM') for (let v = 1; v <= 8; v++) ALL_ANIMALS.push(a + v);
const ALL_CHARS = ['merchant_win', 'merchant_lose', 'maharaja_win', 'maharaja_lose',
  'thief_win', 'thief_lose', 'hunter_win', 'hunter_lose'];

const fam = id => id[0];
const val = id => +id.slice(1);
const chKind = id => id.split('_')[0];
const chBet = id => id.split('_')[1]; // 'win' | 'lose'

function beats(a, b) { // does card a beat card b
  if (fam(a) === fam(b)) return val(a) > val(b);
  return (fam(a) === 'E' && fam(b) === 'T') || (fam(a) === 'T' && fam(b) === 'M') || (fam(a) === 'M' && fam(b) === 'E');
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
function rm(arr, x) { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; }
function cnt(arr, f) { let n = 0; for (const x of arr) if (x[0] === f) n++; return n; }

function newPlayer() { return { hand: [], known: [], chars: [], palace: [], jungle: [], favor: 0, honor: 0 }; }

function newGame() {
  const s = { round: 1, turn: 1, wins: [0, 0], P: [newPlayer(), newPlayer()], piles: [[], []], removed: [], gone: [],
    charDeck: shuffle(ALL_CHARS.slice()), charDiscard: [], tok: {}, log: null, over: false };
  setupRound(s);
  return s;
}

function setupRound(s) {
  const deck = shuffle(ALL_ANIMALS.slice());
  s.removed = deck.splice(0, 4);
  s.gone = [];
  for (const p of s.P) { p.hand = deck.splice(0, 2); p.known = []; p.palace = []; p.jungle = []; }
  s.piles = [deck.splice(0, 8), deck.splice(0, 8)];
  s.turn = 1;
  s.tok = {
    palace: { side: Math.random() < 0.5 ? 'A' : 'B', taken: 0 },
    jungle: { side: Math.random() < 0.5 ? 'A' : 'B', taken: 0 }
  };
  if (s.round > 1) {
    const kept = s.P[0].chars.concat(s.P[1].chars);
    s.charDeck = shuffle(ALL_CHARS.filter(c => !kept.includes(c)));
    s.charDiscard = [];
  }
}

function clone(s) {
  return {
    round: s.round, turn: s.turn, wins: s.wins.slice(), over: s.over,
    P: s.P.map(p => ({ hand: p.hand.slice(), known: p.known.slice(), chars: p.chars.slice(), palace: p.palace.slice(),
      jungle: p.jungle.slice(), favor: p.favor, honor: p.honor })),
    piles: [s.piles[0].slice(), s.piles[1].slice()], removed: s.removed.slice(), gone: s.gone.slice(),
    charDeck: s.charDeck.slice(), charDiscard: s.charDiscard.slice(),
    tok: { palace: { ...s.tok.palace }, jungle: { ...s.tok.jungle } }, log: null, pending: (s.pending || []).slice(), inPlay: [null, null]
  };
}

function L(s, msg) { if (s.log) s.log(msg); }
const PN = p => (p === 0 ? '<b class="you">당신</b>' : '<b class="ai">AI</b>');
const CN = id => `<b class="${ANIMAL[fam(id)].cls}">${ANIMAL[fam(id)].name} ${val(id)}</b>`;
const CHN = id => `<b class="chn">${CHARNAME[chKind(id)]}</b>`;

/* ---------- ops (atomic relocations; reversible) ---------- */
function applyOp(s, op) {
  switch (op.op) {
    case 'move': rm(s.P[op.p][op.from], op.id); s.P[op.p][op.to].push(op.id); break;
    case 'steal': rm(s.P[op.fp][op.from], op.id); s.P[op.tp][op.to].push(op.id); break;
    case 'elim': rm(s.P[op.p][op.from], op.id); s.gone.push(op.id); break;
    case 'discard': rm(s.P[op.p].chars, op.id); s.charDiscard.push(op.id); break;
  }
}
function undoOp(s, op) {
  switch (op.op) {
    case 'move': rm(s.P[op.p][op.to], op.id); s.P[op.p][op.from].push(op.id); break;
    case 'steal': rm(s.P[op.tp][op.to], op.id); s.P[op.fp][op.from].push(op.id); break;
    case 'elim': rm(s.gone, op.id); s.P[op.p][op.from].push(op.id); break;
    case 'discard': rm(s.charDiscard, op.id); s.P[op.p].chars.push(op.id); break;
  }
}
function describeOp(op) {
  switch (op.op) {
    case 'move': return `${PN(op.p)}의 ${LOCNAME[op.from]}에 있던 ${CN(op.id)}을(를) ${LOCNAME[op.to]}(으)로 옮겼습니다`;
    case 'steal': return `${PN(op.fp)}의 ${LOCNAME[op.from]}에서 ${CN(op.id)}을(를) 가져와 자신의 ${LOCNAME[op.to]}에 놓았습니다`;

/* ============================================================

   ============================================================ */

      const plays = [];
      plays[me] = concrete(t.P[me], myHand, myActs[a]);
      plays[o] = concrete(t.P[o], oppHand, oppSlots[b]);
      playTurnSync(t, plays);
      const v = rolloutRound(t, me);
      sum[a][b] += v; n[a][b]++;
    }
    iters++;
    if (iters > 400) break;
  }
  const U = sum.map((row, a) => Array.from(row, (x, b) => x / Math.max(1, n[a][b])));
  let probs;
  if (mode === 'mixed') probs = regretMatch(U, 3000);
  else {
    const m = U.map(r => {
      const mean = r.reduce((x, y) => x + y, 0) / r.length;
      return mode === 'hard' ? 0.75 * mean + 0.25 * Math.min(...r) : mean;
    });
    const best = m.indexOf(Math.max(...m));
    probs = m.map((_, i) => (i === best ? 1 : 0));
  }
  // sample from mixed strategy (drop tiny probabilities)
  const clean = probs.map(p => (p < 0.08 ? 0 : p));
  const tot = clean.reduce((x, y) => x + y, 0) || 1;
  let r = Math.random() * tot, pick = 0;
  for (let i = 0; i < A; i++) { r -= clean[i]; if (r <= 0) { pick = i; break; } }
  return { play: concrete(s.P[me], myHand, myActs[pick]), iters };
}

function regretMatch(U, iters) {
  const A = U.length, B = U[0].length;
  const rA = new Float64Array(A), rB = new Float64Array(B), sA = new Float64Array(A);
  const strat = (r) => { const pos = Array.from(r, x => Math.max(0, x)); const t = pos.reduce((a, b) => a + b, 0); return t > 0 ? pos.map(x => x / t) : pos.map(() => 1 / r.length); };
  for (let it = 0; it < iters; it++) {
    const pa = strat(rA), pb = strat(rB);
    const ua = new Float64Array(A), ub = new Float64Array(B);
    let ev = 0;
    for (let a = 0; a < A; a++) for (let b = 0; b < B; b++) { ua[a] += pb[b] * U[a][b]; ub[b] -= pa[a] * U[a][b]; }
    for (let a = 0; a < A; a++) ev += pa[a] * ua[a];
    for (let a = 0; a < A; a++) { rA[a] += ua[a] - ev; sA[a] += pa[a]; }
    let evb = 0; for (let b = 0; b < B; b++) evb += pb[b] * ub[b];
    for (let b = 0; b < B; b++) rB[b] += ub[b] - evb;
  }
  const t = sA.reduce((a, b) => a + b, 0);
  return Array.from(sA, x => x / t);
}

// Monte-Carlo refill pick for the AI (when it lost the duel)
function mcRefill(s, me, budgetMs) {
  const sum = [0, 0], n = [0, 0];
  const t0 = performance.now();
  let it = 0;
  while (performance.now() - t0 < budgetMs || it < 4) {
    const d = determinize(s, me);
    for (const pick of [0, 1]) {
      const t = clone(d);
      doRefill(t, me, pick);
      t.turn++;
      sum[pick] += rolloutRound(t, me); n[pick]++;
    }
    if (++it > 600) break;
  }
  return sum[0] / n[0] >= sum[1] / n[1] ? 0 : 1;
}

// AI decision for a mid-turn request on the real state
function aiDecide(s, req) {
  if (req.type === 'order') {
    return req.options[0];
  }
  return greedyChoose(s, req);
}

</script>
<script>
/* ============================================================
   UI
   ============================================================ */
const UI = { diff: 'normal', speed: 'normal', sel: { card: null, char: null }, prompt: null, logs: [], duel: null,
  thinking: false, glow: new Set(), step: null, stepNo: 0, origin: {} };
try { UI.diff = localStorage.getItem('haati.diff') || 'normal'; UI.speed = localStorage.getItem('haati.speed') || 'normal'; } catch (e) {}
let S = null;
const $ = (q) => document.querySelector(q);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const DIFF = { easy: '쉬움', normal: '보통', hard: '어려움' };
const SPEED = { manual: '한 단계씩', normal: '보통', fast: '빠르게' };
const STEP_MS = { manual: 0, normal: 1500, fast: 750 };
const ANIM_MS = () => (UI.speed === 'fast' ? 380 : 620);

function addLog(m, cls) { UI.logs.unshift({ m, cls }); if (UI.logs.length > 150) UI.logs.pop(); renderLog(); }

/* ---------- card markup (data-k = animation key) ---------- */
function animalCard(id, size, extra = '', key = id) {
  return `<div class="card ${size} ${extra} ${UI.glow.has(id) ? 'glow' : ''}" data-id="${id}" data-k="${key}"><img src="${IMG[id]}" alt="">` +
    (size === 'mini' ? `<span class="badge ${fam(id)}">${val(id)}</span>` : '') + `</div>`;
}
function backCard(size, kind = 'animal', extra = '', key = '') {
  return `<div class="card ${size} ${extra}" ${key ? `data-k="${key}"` : ''}><img src="${IMG['back_' + kind]}" alt=""></div>`;
}
function charCard(id, size, extra = '') { return `<div class="card ${size} ${extra}" data-ch="${id}" data-k="c:${id}"><img src="${IMG[id]}" alt=""></div>`; }
function charLabel(id) { return `${CHARNAME[chKind(id)]}<small>${chBet(id) === 'win' ? '✔ 승리에 걸기' : '✘ 패배에 걸기'}</small>`; }

function pickSet() {
  const p = UI.prompt; const set = new Set();
  if (p && p.kind === 'req' && p.req.type === 'target') for (const o of p.req.options) if (o.id) set.add(o.id);
  return set;
}
function rowHTML(loc, pidx, picks) {
  const cards = S.P[pidx][loc];
  const t = S.tok[loc];
  const run = runLen(cards);
  const hint = t.taken ? '' : (run >= 2 ? `연속 ${run}/4` : '');
  return `<div class="row" data-row="${pidx}-${loc}"><div class="lab">${LOCNAME[loc]}<small>${cards.length}장</small></div><div class="cards">` +

    `</div><div class="seq">${hint}</div></div>`;
}
function chipsHTML(p, idx) {
  return `<div class="chips" data-chips="${idx}"><span class="chip"><img src="${IMG.favor}">총애 ${p.favor}</span>` +
    `<span class="chip"><img src="${IMG.honor}">명예 ${p.honor}</span><span class="chip pres">위신 ${p.favor + p.honor}</span></div>`;
}
function winsHTML(n) { return `<span class="wins">${[0, 1].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`; }

/* ---------- render ---------- */
function render() {
  if (!S) return;
  const prev = snapshot();
  const picks = pickSet();
  const pr = UI.prompt, d = UI.duel;
  const hide = new Set(d && !d.started ? [d.plays[0].card, d.plays[0].char, d.plays[1].card, d.plays[1].char] : []);
  const ai = S.P[1], me = S.P[0];
  const aiHandIds = ai.hand.filter(x => !hide.has(x));
  const aiHand = aiHandIds.map((id, i) => ai.known.includes(id)
    ? `<div class="cwrap">${animalCard(id, 'md')}<div class="cl"><small>공개된 카드</small></div></div>`
    : `<div class="cwrap">${backCard('md', 'animal', '', 'aih:' + i)}<div class="cl"><small>비공개</small></div></div>`).join('');
  const aiCharN = ai.chars.filter(x => !hide.has(x)).length;
  const aiChars = Array.from({ length: aiCharN }, (_, i) => backCard('md', 'char', '', 'aic:' + i)).join('');
  const discardPick = pr && pr.kind === 'req' && pr.req.type === 'discard';
  const myChars = me.chars.filter(x => !hide.has(x)).map(id => `<div class="cwrap">${charCard(id, 'big',
    (UI.sel.char === id ? 'sel ' : '') + (discardPick ? 'pick' : ''))}<div class="cl">${charLabel(id)}</div></div>`).join('');
  const myHand = me.hand.filter(x => !hide.has(x)).map(id => `<div class="cwrap">${animalCard(id, 'big', UI.sel.card === id ? 'sel' : '')}` +
    `<div class="cl"><small>${me.known.includes(id) ? 'AI도 아는 카드' : '나만 아는 카드'}</small></div></div>`).join('');
  const pilePick = pr && pr.kind === 'refill';
  const pileHTML = (i) => {
    const pile = S.piles[i];
    if (!pile.length) return `<div class="pile"><div class="empty-slot"></div>비었음</div>`;
    const top = pile[pile.length - 1];
    return `<div class="pile"><div class="stack">${animalCard(top, 'md', pilePick ? 'pick' : '').replace('data-id', `data-pile="${i}" data-id`)}</div>${i === 0 ? '왼쪽' : '오른쪽'} 더미 ${pile.length}장</div>`;
  };
  // duel area
  let center;
  if (d) {
    const sideH = (p) => {
      const pl = d.plays[p];
      const showCard = !d.started || (S.pending || []).includes(pl.card);
      const showChar = pl.char && (!d.started || (S.inPlay && S.inPlay[p] === pl.char));
      let cardH = '<div class="empty-slot sm"></div>';
      if (showCard) {
        if (!d.revealed && p === 1) cardH = backCard('md', 'animal', '', 'duel:1');
        else cardH = animalCard(pl.card, 'md', d.flip && p === 1 ? 'flipin' : '');
      }
      let charH = '';
      if (showChar) {
        if (!d.revealed && p === 1) charH = backCard('mini', 'char', '', 'duelc:1');
        else charH = charCard(pl.char, 'mini', d.flip && p === 1 ? 'flipin' : '');
      }
      const won = d.winner === p;
      const tag = d.winner == null ? '' : (won ? '<span class="win-mark">★ 승리 → 궁전</span>' : '<span class="lose-mark">패배 → 정글</span>');
      return `<div class="side ${d.winner == null ? '' : (won ? 'won' : 'lost')}"><span style="color:var(--${p ? 'ai' : 'you'})">${p ? 'AI' : '당신'}</span>` +
        `<div class="pc">${cardH}${charH}</div>${tag}</div>`;
    };
    center = `<div class="duel">${sideH(0)}<div class="vs">VS</div>${sideH(1)}</div>`;
  } else {
    center = `<div class="hint" style="text-align:center">코끼리 &gt; 호랑이 &gt; 생쥐 &gt; 코끼리<br>같은 동물이면 숫자가 높은 쪽 승리</div>`;
  }
  const tokH = (loc) => {
    const t = S.tok[loc], r = TOKENS[loc][t.side];
    return `<div class="tok ${t.taken ? 'taken' : ''}" data-tok="${loc}"><img src="${IMG['tok_' + loc + '_' + t.side]}"><span>${LOCNAME[loc]} 컬렉션</span>` +
      `<span>총애 ${r.f}${r.h ? ` + 명예 ${r.h}` : ''}</span>${t.taken ? `<span style="color:var(--${t.taken === 1 ? 'you' : 'ai'})">${t.taken === 1 ? '당신' : 'AI'} 획득</span>` : ''}</div>`;
  };
  const charDeck = `<div class="cdeck">${backCard('mini', 'char', '', 'chardeck')}<span>인물 ${S.charDeck.length}</span></div>`;

  $('#app').innerHTML = `
  <header>
    <div class="logo serif">하티</div>
    <div class="meta"><span>라운드 ${S.round} · 턴 ${Math.min(S.turn, 9)}/9</span>
      <span>당신 ${winsHTML(S.wins[0])}</span><span>AI ${winsHTML(S.wins[1])}</span><span>AI: ${DIFF[UI.diff]}</span></div>
    <div class="sp"></div>
    <button id="btnRef">효과 보기</button><button id="btnMenu">메뉴</button>
  </header>
  <div class="layout">
   <div>
    <div class="board">
      <div class="zone aiZ">
        <div class="zhead"><span class="who ai">AI</span>${chipsHTML(ai, 1)}</div>
        <div class="rows">${rowHTML('palace', 1, picks)}${rowHTML('jungle', 1, picks)}</div>
        <div class="hand"><div class="grp">${aiHand}</div><div class="grp">${aiChars}</div>
          ${aiCharN ? `<span class="hint">인물 카드 ${aiCharN}장</span>` : ''}</div>
      </div>
      <div class="mid">${pileHTML(0)}<div class="center">${center}<div class="tokens">${tokH('palace')}${charDeck}${tokH('jungle')}</div></div>${pileHTML(1)}</div>
      <div class="bar ${UI.step && pr && pr.kind === 'step' ? 'stepbar' : ''}" id="bar">${barHTML()}</div>
      <div class="zone meZ">
        <div class="zhead"><span class="who you">당신</span>${chipsHTML(me, 0)}</div>
        <div class="rows">${rowHTML('palace', 0, picks)}${rowHTML('jungle', 0, picks)}</div>
        <div class="hand"><div class="grp">${myHand}</div><div class="grp">${myChars}</div></div>
      </div>
    </div>
   </div>
   <div class="side-panel">
     <div class="panel"><h3>진행 기록</h3><div class="log" id="log"></div></div>
     <div class="panel ref">${refHTML()}</div>
   </div>
  </div>`;
  renderLog();
  bind();
  animateFrom(prev);
  UI.origin = {};
  if (d && d.flip) d.flip = false;
}

/* ---------- FLIP animation ---------- */
function snapshot() {
  const m = new Map();
  document.querySelectorAll('#app [data-k]').forEach(el => m.set(el.dataset.k, { r: el.getBoundingClientRect(), html: el.outerHTML }));
  return m;
}
function originFor(k, prev) {
  if (UI.origin[k] && prev.has(UI.origin[k])) return UI.origin[k];
  if (k === 'duel:1' || k === 'duelc:1') {
    const pref = k === 'duel:1' ? 'aih:' : 'aic:';
    const cand = [...prev.keys()].filter(x => x.startsWith(pref));
    return cand.length ? cand[cand.length - 1] : null;
  }
  if (k.startsWith('c:') || k.startsWith('aic:')) return 'chardeck';
  return null;
}
function animateFrom(prev) {
  if (!prev.size) return;
  const ms = ANIM_MS();
  const now = new Map();
  document.querySelectorAll('#app [data-k]').forEach(el => now.set(el.dataset.k, el));
  const used = new Set();
  for (const [k, el] of now) {
    let src = prev.get(k);
    if (!src) { const o = originFor(k, prev); if (o) { src = prev.get(o); used.add(o); } }
    if (!src) continue;
    const r = el.getBoundingClientRect();
    if (!r.width) continue;
    const dx = src.r.left - r.left, dy = src.r.top - r.top, sx = src.r.width / r.width, sy = src.r.height / r.height;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < 0.03) continue;
    el.style.zIndex = 40;
    const a = el.animate([
      { transformOrigin: 'top left', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` },
      { transformOrigin: 'top left', transform: 'translate(0,0) scale(1,1)' }
    ], { duration: ms, easing: 'cubic-bezier(.25,.8,.25,1)' });
    a.onfinish = () => { el.style.zIndex = ''; };
  }
  for (const [k, p] of prev) {
    if (now.has(k) || used.has(k) || k === 'chardeck') continue;
    if (k.startsWith('aih:') || k.startsWith('aic:')) continue; // hidden backs just vanish
    ghost(p, ms);
  }
}
function ghost(p, ms) {
  const g = document.createElement('div');
  g.className = 'ghostcard';
  g.style.cssText = `left:${p.r.left}px;top:${p.r.top}px;width:${p.r.width}px;height:${p.r.height}px`;
  g.innerHTML = p.html;
  const c = g.firstElementChild; if (c) { c.style.width = '100%'; c.style.height = '100%'; }
  document.body.appendChild(g);
  g.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.4) rotate(-12deg)' }], { duration: ms + 150, easing: 'ease-in' }).onfinish = () => g.remove();
}
function floatText(p, html) {
  const el = document.querySelector(`[data-chips="${p}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'floater';
  f.innerHTML = html;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top) + 'px';
  document.body.appendChild(f);
  f.animate([{ opacity: 0, transform: 'translate(-50%,6px) scale(.8)' }, { opacity: 1, transform: 'translate(-50%,-14px) scale(1.1)', offset: .25 },
    { opacity: 1, transform: 'translate(-50%,-22px) scale(1)', offset: .75 }, { opacity: 0, transform: 'translate(-50%,-34px)' }],
  { duration: 1500, easing: 'ease-out' }).onfinish = () => f.remove();
  el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 500 });
}

/* ---------- prompt bar ---------- */
const STEP_ICON = { reveal: '⚔', place: '⬇', gain: '✦', op: '⇄', draw: '＋', discard: '－', collect: '★', charOk: '✔', charFail: '✘', skip: '·', none: '·' };
function barHTML() {
  const p = UI.prompt;
  if (UI.thinking) return `<div class="msg">AI가 고민하고 있습니다<span class="thinking"><i></i><i></i><i></i></span></div>`;
  if (!p) return `<div class="msg">${UI.status || '진행 중…'}</div>`;
  if (p.kind === 'step') {
    const st = UI.step;
    return `<div class="stepno">${STEP_ICON[st.k] || '•'}<small>${UI.stepNo}</small></div><div class="msg">${st.msg}</div>` +
      `<div class="btns"><button class="ghost" id="btnStep">다음 ▶</button></div>` +
      (UI.speed !== 'manual' ? `<div class="stepbarfill" style="animation-duration:${STEP_MS[UI.speed]}ms"></div>` : '');
  }
  if (p.kind === 'play') {
    const ok = !!UI.sel.card;
    const chTxt = UI.sel.char ? ` + ${CHARNAME[chKind(UI.sel.char)]}(${chBet(UI.sel.char) === 'win' ? '승리' : '패배'}에 걸기)` : '';
    return `<div class="msg">${UI.sel.card ? `선택: ${CN(UI.sel.card)}${chTxt}` : '낼 동물 카드를 고르세요'}${S.P[0].chars.length && UI.sel.card ? '<br><span class="hint">인물 카드를 눌러 함께 낼 수 있습니다(선택 사항)</span>' : ''}</div>` +
      `<div class="btns"><button class="gold" id="btnGo" ${ok ? '' : 'disabled'}>대결!</button></div>`;
  }
  if (p.kind === 'refill') return `<div class="msg">대결에서 졌으므로 먼저 고릅니다. 가져올 카드를 누르세요<br><span class="hint">남은 카드는 AI가 가져갑니다</span></div>`;
  if (p.kind === 'next') return `<div class="msg">${p.msg}</div><div class="btns"><button id="btnNext">${p.btn || '계속'}</button></div>`;
  if (p.kind === 'req') {
    const r = p.req;
    if (r.type === 'order') return `<div class="msg">${CHARNAME[chKind(r.ch)]} 내기 성공! 어떤 효과를 먼저 처리할까요?</div>` +
      `<div class="btns"><button id="oChar">인물 효과 먼저</button><button class="ghost" id="oAnimal">동물 효과 먼저</button></div>`;
    if (r.type === 'draw') return `<div class="msg">${r.title}</div><div class="btns"><button id="dDraw">뽑기</button><button class="ghost" id="dSkip">건너뛰기</button></div>`;
    if (r.type === 'discard') return `<div class="msg">${r.title}<br><span class="hint">버릴 인물 카드를 누르세요</span></div>`;
    if (r.type === 'target') {
      const any = r.options.some(o => o.op !== 'skip');
      return `<div class="msg">${r.title}${any ? '<br><span class="hint">빛나는 카드를 누르세요</span>' : '<br><span class="hint">대상이 없습니다</span>'}</div>` +
        `<div class="btns"><button class="ghost" id="tSkip">${any ? '건너뛰기' : '확인'}</button></div>`;
    }
  }
  return '';
}
function renderLog() {
  const el = document.getElementById('log');
  if (el) el.innerHTML = UI.logs.map(l => `<div class="${l.cls || ''}">${l.m}</div>`).join('');
}
function refHTML() {
  return `<h3>효과 요약</h3><table>
  <tr><td></td><td><b>궁전 (승자, 반드시)</b></td><td><b>정글 (패자, 선택)</b></td></tr>
  <tr><td class="el">코끼리</td><td>궁전의 코끼리 1마리당 총애 1</td><td>정글의 동물 1장 → 궁전</td></tr>
  <tr><td class="ti">호랑이</td><td>정글의 호랑이 1마리당 총애 1, 인물 카드 1장</td><td>궁전의 동물 1장 → 정글</td></tr>
  <tr><td class="mo">생쥐</td><td>궁전의 생쥐 2마리마다 명예 1 + 총애 1</td><td>인물 카드 1장</td></tr></table>
  <p class="hint" style="margin:6px 0 0">컬렉션: 한 장소에 연속된 숫자 4장(동물 무관) → 해당 토큰 보상. 위신 = 총애 + 명예. 라운드가 끝나면 총애는 버리고 명예는 총애로 뒤집습니다.</p>`;
}

/* ---------- interactions ---------- */
function bind() {
  const pr = UI.prompt;
  document.querySelectorAll('.meZ .hand .card[data-id]').forEach(el => el.onclick = () => {
    if (!pr || pr.kind !== 'play') return;
    UI.sel.card = el.dataset.id; render();
  });
  document.querySelectorAll('.meZ .hand .card[data-ch]').forEach(el => el.onclick = () => {
    if (pr && pr.kind === 'req' && pr.req.type === 'discard') {
      const op = pr.req.options.find(o => o.id === el.dataset.ch); if (op) resolvePrompt(op); return;
    }
    if (!pr || pr.kind !== 'play') return;
    UI.sel.char = UI.sel.char === el.dataset.ch ? null : el.dataset.ch; render();
  });
  document.querySelectorAll('.row .card.pick').forEach(el => el.onclick = () => {
    const op = pr.req.options.find(o => o.id === el.dataset.id); if (op) resolvePrompt(op);
  });
  document.querySelectorAll('.pile .card.pick').forEach(el => el.onclick = () => resolvePrompt(+el.dataset.pile));
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('btnGo', () => { if (UI.sel.card) resolvePrompt({ card: UI.sel.card, char: UI.sel.char }); });
  on('btnNext', () => resolvePrompt(true));
  on('btnStep', () => resolvePrompt(true));
  on('oChar', () => resolvePrompt(pr.req.options[0]));
  on('oAnimal', () => resolvePrompt(pr.req.options[1]));
  on('dDraw', () => resolvePrompt(pr.req.options[0]));
  on('dSkip', () => resolvePrompt(pr.req.options[1]));
  on('tSkip', () => resolvePrompt(pr.req.options.find(o => o.op === 'skip')));
  on('btnRef', () => showRules());
  on('btnMenu', () => showMenu());
}
function ask(prompt) { return new Promise(res => { UI.prompt = { ...prompt, resolve: res }; render(); }); }
function resolvePrompt(v) { const p = UI.prompt; if (!p) return; UI.prompt = null; p.resolve(v); }

// show one effect step; auto-advance by speed setting (tap to skip / manual)
async function showStep(st) {
  UI.step = st; UI.stepNo++;
  UI.glow = new Set(st.glow || []);
  const prom = ask({ kind: 'step' });
  if (st.k === 'gain' || st.k === 'collect') {
    const parts = [];
    if (st.f) parts.push(`+${st.f} 총애`);
    if (st.h) parts.push(`+${st.h} 명예`);
    if (parts.length) setTimeout(() => floatText(st.p, parts.join(' ')), 60);
  }
  if (st.k === 'collect') { const t = document.querySelector(`[data-tok="${st.loc}"]`); if (t) t.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35) rotate(10deg)' }, { transform: 'scale(1)' }], { duration: 700 }); }
  let timer = null;
  if (UI.speed !== 'manual') timer = setTimeout(() => { if (UI.prompt && UI.prompt.kind === 'step') resolvePrompt(true); }, STEP_MS[UI.speed] + (st.k === 'reveal' ? 300 : 0));
  await prom;
  clearTimeout(timer);
  UI.step = null; UI.glow = new Set();
}

/* ---------- game flow ---------- */
let GAME_ID = 0;
async function startGame() {
  const gid = ++GAME_ID;
  closeModal();
  S = newGame();
  UI.logs = []; UI.duel = null; UI.prompt = null; UI.sel = { card: null, char: null }; UI.glow = new Set();
  S.log = (m) => addLog(m);
  addLog(`새 게임 시작 — AI 난이도: ${DIFF[UI.diff]}`, 'r');
  addLog('라운드 1 시작', 'r');
  render();
  try { await gameLoop(gid); } catch (e) { if (e !== 'abort') { console.error(e); addLog('오류: ' + e.message); } }
}
function alive(gid) { if (gid !== GAME_ID) throw 'abort'; }

async function gameLoop(gid) {
  while (!S.over) {
    while (S.turn <= 9) { await playTurn(gid); alive(gid); }
    const before = S.P.map(p => ({ f: p.favor, h: p.honor }));
    const r = endRound(S);
    UI.duel = null; render();
    const why = { prestige: '위신이 더 높습니다', honor: '위신 동점 → 명예가 더 많습니다', duel: '위신·명예 동점 → 마지막 동물 카드 대결' }[r.why];
    addLog(`라운드 ${S.round} 종료: ${r.w === 0 ? '당신' : 'AI'} 승리 (${why})`, 'r');
    await roundModal(r, before, why);
    alive(gid);
    if (!S.over) {
      S.round++; setupRound(S);
      addLog(`라운드 ${S.round} 시작 — 지난 라운드의 명예가 총애로 넘어왔습니다`, 'r');
      render();
    }
  }
  gameOverModal();
}

async function playTurn(gid) {
  UI.duel = null; UI.sel = { card: null, char: null }; UI.status = ''; UI.stepNo = 0;
  const human = await ask({ kind: 'play' });
  alive(gid);
  UI.thinking = true; render();
  await sleep(60);
  const aiPlay = computeAIPlay();
  await sleep(200);
  alive(gid);
  UI.thinking = false;
  // 1) both cards go face down to the duel area
  UI.duel = { plays: [human, aiPlay], revealed: false, started: false, winner: null };
  UI.status = '두 카드를 동시에 공개합니다…';
  render();
  await sleep(ANIM_MS() + 350);
  // 2) reveal
  UI.duel.revealed = true; UI.duel.flip = true;
  UI.origin = { [aiPlay.card]: 'duel:1' };
  if (aiPlay.char) UI.origin['c:' + aiPlay.char] = 'duelc:1';
  render();
  await sleep(550);
  alive(gid);
  // 3) resolve step by step
  const gen = resolveGen(S, [human, aiPlay]);
  UI.duel.started = true;
  let r = gen.next();
  while (!r.done) {
    const req = r.value;
    let choice;
    if (req.type === 'step') {
      if (req.k === 'reveal') UI.duel.winner = req.w;
      await showStep(req);
    } else if (req.p === 0) {
      if (req.type === 'target' && !req.options.some(o => o.op !== 'skip')) choice = req.options[0];
      else choice = await ask({ kind: 'req', req });
    } else {
      UI.status = 'AI가 효과를 고르는 중…'; render();
      await sleep(UI.speed === 'fast' ? 300 : 650);
      choice = aiDecide(S, req);
    }
    alive(gid);
    r = gen.next(choice);
  }
  render();
  // 4) refill
  const loser = 1 - S.lastWinner;
  if (canRefill(S)) {
    let pick;
    if (loser === 0) pick = await ask({ kind: 'refill' });
    else {
      UI.thinking = true; render(); await sleep(60);
      pick = UI.diff === 'easy' ? quickRefillPick(S, 1, 0.8) : mcRefill(S, 1, UI.diff === 'hard' ? 900 : 350);
      UI.thinking = false;
    }
    alive(gid);
    const a = S.piles[pick][S.piles[pick].length - 1];
    doRefill(S, loser, pick);
    UI.duel = null;
    await showStep({ k: 'place', msg: `${PN(loser)}이(가) ${CN(a)}을(를) 골랐습니다. 남은 카드는 ${PN(1 - loser)}에게 갑니다` });
  }
  S.turn++;
  UI.duel = null;
  if (S.turn <= 9) await ask({ kind: 'next', msg: `턴 ${S.turn - 1} 종료. 다음 턴으로 진행합니다.`, btn: '다음 턴' });
  else await ask({ kind: 'next', msg: '9턴이 모두 끝났습니다. 라운드 결과를 확인하세요.', btn: '결과 보기' });
}

function computeAIPlay() {
  if (UI.diff === 'easy') { const d = determinize(S, 1); return quickPlay(d, 1, 1.2); }
  const ms = UI.diff === 'hard' ? 1600 : 500;
  return mcChoosePlay(S, 1, ms, UI.diff === 'hard' ? 'hard' : 'normal').play;
}


/* ---------- modals ---------- */
function modal(html) { $('#modal').innerHTML = `<div class="modal"><div class="box">${html}</div></div>`; }
function closeModal() { $('#modal').innerHTML = ''; }

function roundModal(r, before, why) {
  return new Promise(res => {
    const pres = before.map(b => b.f + b.h);
    modal(`<h2 class="serif">라운드 ${S.round} 결과</h2>
      <table class="score-t"><tr><th></th><th>총애</th><th>명예</th><th>위신</th></tr>
      <tr><td><b class="you">당신</b></td><td>${before[0].f}</td><td>${before[0].h}</td><td><b>${pres[0]}</b></td></tr>
      <tr><td><b class="ai">AI</b></td><td>${before[1].f}</td><td>${before[1].h}</td><td><b>${pres[1]}</b></td></tr></table>
      <p style="font-size:16px;font-weight:800;text-align:center;margin:6px 0">${r.w === 0 ? '🎉 당신이 이 라운드를 이겼습니다!' : 'AI가 이 라운드를 이겼습니다'}</p>
      <p class="hint" style="text-align:center">${why}${r.why === 'duel' ? ` (${CN(S.P[0].hand[0])} vs ${CN(S.P[1].hand[0])})` : ''}</p>
      <p style="text-align:center">라운드 승리: 당신 ${S.wins[0]} · AI ${S.wins[1]}</p>
      ${S.over ? '' : `<p class="hint" style="text-align:center">“총애는 사라져도, 명예는 남는다!” — 다음 라운드는 각자의 명예만큼 총애를 가지고 시작합니다 (당신 ${S.P[0].favor}, AI ${S.P[1].favor}). 사용하지 않은 인물 카드는 계속 가집니다.</p>`}
      <div class="row2"><button id="mOk">${S.over ? '최종 결과' : '다음 라운드'}</button></div>`);
    $('#mOk').onclick = () => { closeModal(); res(); };
  });
}
function gameOverModal() {
  const youWin = S.wins[0] > S.wins[1];
  modal(`<h2 class="serif" style="text-align:center">${youWin ? '승리!' : '패배'}</h2>
    <p style="text-align:center;font-size:16px">${youWin ? '마하라자의 대결에서 승리했습니다!' : 'AI가 마하라자의 대결에서 승리했습니다.'}</p>
    <p style="text-align:center">최종 라운드 승리 — 당신 ${S.wins[0]} : ${S.wins[1]} AI</p>
    <div class="row2"><button id="mAgain">다시 하기</button><button class="ghost" id="mHome">처음 화면</button></div>`);
  $('#mAgain').onclick = startGame;
  $('#mHome').onclick = showStart;
}
function diffButtons() {
  return `<div class="diff">${Object.entries(DIFF).map(([k, v]) => `<button data-d="${k}" class="${UI.diff === k ? 'on' : ''}">${v}</button>`).join('')}</div>
  <p class="hint" style="text-align:center;margin:0">${{ easy: '감으로 두는 가벼운 상대', normal: '수백 번의 모의 대결로 수를 고릅니다', hard: '더 오래 계산하고 위험을 줄이는 수를 고릅니다' }[UI.diff]}</p>`;
}
function bindDiff(after) {
  document.querySelectorAll('.diff button').forEach(b => b.onclick = () => {
    UI.diff = b.dataset.d; try { localStorage.setItem('haati.diff', UI.diff); } catch (e) {}
    after();
  });
}
function showStart() {
  GAME_ID++;
  S = null; $('#app').innerHTML = '';
  modal(`<div class="title-art">${animalCard('M3', 'big')}${animalCard('E8', 'big')}${animalCard('T5', 'big')}</div>
    <p class="big-title serif">하티</p><p class="sub serif">마하라자의 대결 · AI 대전</p>
    ${diffButtons()}
    <p class="hint" style="text-align:center;margin:10px 0 0">효과 진행 속도</p><div class="speed">${Object.entries(SPEED).map(([k, v]) => `<button data-sp="${k}" class="${UI.speed === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="row2"><button class="gold" id="sGo">게임 시작</button><button class="ghost" id="sRules">규칙 요약</button></div>
    <p class="hint" style="text-align:center;margin-top:12px">2인 대결 · 3판 2선승제 · 한 라운드 9턴</p>`);
  bindDiff(showStart);
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => { UI.speed = b.dataset.sp; try { localStorage.setItem('haati.speed', UI.speed); } catch (e) {} showStart(); });
  $('#sGo').onclick = startGame;
  $('#sRules').onclick = () => showRules(showStart);
}
function showMenu() {
  modal(`<h2 class="serif">메뉴</h2>
    <p>AI 난이도 (다음 게임부터 적용됩니다)</p>${diffButtons()}
    <p>효과 진행 속도 (바로 적용)</p><div class="speed">${Object.entries(SPEED).map(([k, v]) => `<button data-sp="${k}" class="${UI.speed === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="row2"><button id="mNew">새 게임</button><button class="ghost" id="mRules">규칙 요약</button><button class="ghost" id="mClose">닫기</button></div>`);
  bindDiff(showMenu);
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => { UI.speed = b.dataset.sp; try { localStorage.setItem('haati.speed', UI.speed); } catch (e) {} showMenu(); });
  $('#mNew').onclick = startGame;
  $('#mRules').onclick = () => showRules(showMenu);
  $('#mClose').onclick = closeModal;
}
function showRules(back) {
  modal(`<div class="rules"><h2 class="serif">규칙 요약</h2>
  <p>궁정의 신성한 동물 <b class="el">코끼리</b>, <b class="ti">호랑이</b>, <b class="mo">생쥐</b>로 대결해 <b>위신</b>(총애 + 명예)을 쌓습니다. 3판 2선승제, 한 라운드는 9턴입니다.</p>
  <h4>준비</h4><ul><li>동물 카드 24장(동물별 1~8) 중 4장을 제외하고, 각자 2장씩 받습니다.</li>
  <li>남은 16장으로 8장씩 더미 2개를 만들고 맨 위 카드를 공개합니다.</li>
  <li>궁전·정글 컬렉션 토큰은 무작위 면으로 놓입니다.</li></ul>
  <h4>턴 진행</h4><ul>
  <li><b>① 카드 선택</b>: 손의 동물 카드 2장 중 1장을 고릅니다. 가진 인물 카드 1장을 함께 낼 수 있습니다.</li>
  <li><b>② 대결</b>: 코끼리 &gt; 호랑이 &gt; 생쥐 &gt; 코끼리. 같은 동물이면 숫자가 높은 쪽이 이깁니다.</li>
  <li><b>③ 효과</b>: 승자는 카드를 <b>궁전</b>에 놓고 궁전 효과를 <b>반드시</b> 처리합니다. 패자는 카드를 <b>정글</b>에 놓고 정글 효과를 처리<b>할 수 있습니다</b>. 각자 효과 뒤에 컬렉션을 확인합니다(승자 먼저).</li>
  <li><b>④ 보충</b>: 패자가 양쪽 더미의 공개 카드 중 1장을 먼저 고르고, 승자는 남은 카드를 받습니다.</li></ul>
  <h4>동물 효과</h4>${refHTML().replace('<h3>효과 요약</h3>', '')}
  <h4>컬렉션</h4><p>궁전이나 정글 한 곳에 연속된 숫자 4장(순서·동물 무관)이 모이면 그 장소의 토큰 보상을 받습니다. 토큰은 라운드당 한 번, 먼저 완성한 사람만 받습니다.</p>
  <h4>인물 카드 (손에 최대 2장)</h4>
  <p>✔ 카드는 대결 <b>승리</b>에, ✘ 카드는 <b>패배</b>에 거는 카드입니다. 맞히면 효과를 쓰고, 틀리면 그냥 버립니다.</p>
  <ul><li><b>상인</b> ✔ 총애 2 / ✘ 총애 1 + 명예 1</li>
  <li><b>마하라자</b> ✔ 동물 1장을 궁전↔정글로 이동 / ✘ 총애 1 + 이동</li>
  <li><b>도둑</b> ✔ 상대 정글의 동물 1장을 내 정글로 / ✘ 상대 궁전의 동물 1장을 내 궁전으로</li>
  <li><b>사냥꾼</b> ✔ 총애 1 + 상대 동물 1장 제거 / ✘ 명예 1 + 상대 동물 1장 제거</li></ul>
  <p class="hint">옮기거나 가져온 동물은 장소 효과를 발동하지 않습니다. 이동 효과로 상대 쪽 동물을 내 쪽으로 옮길 수는 없습니다(도둑 제외).</p>
  <h4>라운드 종료</h4><p>위신이 높은 쪽이 승리(동점이면 명예, 그래도 동점이면 마지막 남은 동물 카드로 대결). 이후 총애는 버리고 명예는 뒤집어 다음 라운드의 총애가 됩니다.</p>
  </div><div class="row2"><button id="rBack">${back ? '돌아가기' : '닫기'}</button></div>`);
  $('#rBack').onclick = back || closeModal;
}

showStart();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
